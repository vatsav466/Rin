; ──────────────────────────────────────────────────────────────────────────────
; supervisord.conf — manages all processes inside the NOVEX Docker container
;
; Processes:
;   api        — FastAPI (uvicorn) on port 8002
;   nginx      — reverse proxy + static file server on port 5378
;
; NOTE: redis is intentionally NOT managed here. The container runs with
; --network host, so "localhost:6379" inside the container IS the host's
; network namespace. The host already runs its own redis-server on 6379
; (confirmed via `ss -tlnp | grep 6379`), so a redis managed by supervisord
; here would always lose the bind race against the host's instance.
; The API's .alg_env already points at redis://localhost:6379, which
; resolves correctly to the host's redis under --network host.
; ──────────────────────────────────────────────────────────────────────────────

[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── FastAPI backend (uvicorn, single worker) ───────────────────────────────────
[program:api]
command=/opt/venv/bin/python -m urdhva_base
directory=/opt/ceg/algo/api_manager
environment=PORT="8002",MODE="prod",PYTHONPATH="/opt/ceg/algo"
autostart=true
autorestart=true
startsecs=10
startretries=5
priority=20
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

; ── nginx ─────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
