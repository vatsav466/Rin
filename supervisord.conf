[supervisord]
nodaemon=true
logfile=/var/log/supervisord.log
logfile_maxbytes=10MB
logfile_backups=3
loglevel=info
pidfile=/tmp/supervisord.pid
user=root

[unix_http_server]
file=/tmp/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

; ── FastAPI backend (uvicorn) ────────────────────────────────────────────────
[program:api]
command=/opt/venv/bin/python -m urdhva_base
directory=/opt/ceg/algo/api_manager
environment=PORT="8002",MODE="prod",PYTHONPATH="/opt/ceg/algo:/opt/ceg/algo/api_manager",ALG_ENV_PATH="/opt/ceg/algo/api_manager/.alg_env"
autostart=true
autorestart=true
startsecs=5
startretries=5
priority=20
stdout_logfile=/var/log/api.log
stderr_logfile=/var/log/api.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true

; ── Nginx ────────────────────────────────────────────────────────────────────
[program:nginx]
command=nginx -g "daemon off;"
autostart=true
autorestart=true
startsecs=5
priority=30
stdout_logfile=/var/log/nginx_access.log
stderr_logfile=/var/log/nginx_error.log
stdout_logfile_maxbytes=10MB
stopasgroup=true
killasgroup=true
